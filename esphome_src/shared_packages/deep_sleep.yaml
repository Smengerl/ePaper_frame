#-------------------------------------------
# Deep Sleep Management
# Enables power-saving mode and wakeup tracking
#-------------------------------------------

sensor:
# Sensor to track why the device woke up from deep sleep
# Values correspond to ESP32 wakeup causes (timer, touchpad, GPIO, etc.)
  - platform: template
    name: "Wakeup Cause"
    id: boot_wakeup_cause
    update_interval: never
    accuracy_decimals: 0

# Timestamp of the last device boot/wakeup
  - platform: template
    name: "Last boot"
    id: boot_timestamp
    device_class: timestamp
    update_interval: never


esphome:
  on_boot:
    # Execute this after all other boot tasks are complete
    priority: -100
    then:
      - lambda: |-
          id(boot_timestamp).publish_state(id(esptime).now().timestamp); //.strftime("%Y-%m-%dT%H:%M:%S"));
          auto wakeup_cause = esp_sleep_get_wakeup_cause();
          id(boot_wakeup_cause).publish_state(wakeup_cause);

#-------------------------------------------
# Time Synchronization
# Required for sleep scheduling and timestamps
#-------------------------------------------
time:
  - platform: homeassistant
    id: esptime

#-------------------------------------------
# Deep Sleep Configuration
#-------------------------------------------
deep_sleep:
  id: deep_sleep_id

  # Allow manual wakeup using the boot button (GPIO0)
  # Button press (low signal) will wake the device
  wakeup_pin:
    number: GPIO0
    inverted: true
    mode: INPUT_PULLUP
    ignore_strapping_warning: true

#-------------------------------------------
# API Actions for Sleep Control
# Expose sleep functions for Home Assistant automations
#-------------------------------------------
api:
  actions:
  # Action to put device to sleep for a specified number of minutes
  - action: sleep_for
    variables:
      min: int
    then:
      - lambda: |-
          ESP_LOGI("${TAG}", "Sleep for %d min", (int) min);
          id(onboard_led).turn_off(); // Turn off the LED before deep sleep

          id(deep_sleep_id).set_sleep_duration(min*60*1000); // parameter is in min, needs to be converted to ms
          id(deep_sleep_id).begin_sleep();

  # Action to schedule wakeup at a specific time (HH:MM)
  # If target time has passed today, will wake tomorrow at that time
  - action: sleep_until
    variables:
      target_minute: int
      target_hour: int
    then:
      - lambda: |-
          if (target_minute>=0 && target_minute<60) {
            if (target_hour>=0 && target_hour<24) {

              time_t current_time_t = id(esptime).timestamp_now();
              struct tm *timeinfo = localtime(&current_time_t);
              timeinfo->tm_hour = (unsigned int)target_hour;
              timeinfo->tm_min = target_minute;
              timeinfo->tm_sec = 0;
              time_t sleep_until_time_t = mktime(timeinfo);

              if (sleep_until_time_t <= current_time_t) {
                // If target time has already passed today, add one day
                sleep_until_time_t += 24 * 60 * 60;
              }

              int difference = (int)difftime(sleep_until_time_t, current_time_t); // Difference in seconds

              ESP_LOGW("${TAG}", "Sleep until %02d:%02d equals sleeping for %ds (%02d:%02d:%02d)", (int) target_hour, (int) target_minute, difference, difference / 3600, (difference % 3600) / 60, difference % 60);
              id(onboard_led).turn_off(); // Turn off the LED before deep sleep
              id(deep_sleep_id).set_sleep_duration(difference*1000); 
              id(deep_sleep_id).begin_sleep();

            } else {
              ESP_LOGW("${TAG}", "hour need to be a value between 0-23");
            }
          } else {
            ESP_LOGW("${TAG}", "min need to be a value between 0-60");
          }


