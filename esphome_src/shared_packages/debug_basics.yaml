#-------------------------------------------
# Debug and Diagnostics
# Provides system health monitoring sensors
#-------------------------------------------

# Update debug information every 60 seconds
debug:
  update_interval: 60s

sensor:
  # Memory usage sensors to monitor heap allocation
  - platform: debug
    free:
      name: "Heap Free"
      entity_category: diagnostic
    block:
      name: "Heap Max Block"
      entity_category: diagnostic
#    psram:
#      name: "PSRAM"
#      entity_category: diagnostic

  # WiFi signal strength in dBm (internal use only)
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic
    internal: true

  # WiFi signal strength converted to percentage (0-100%)
  # Formula converts dBm to percentage: 2 * (dBm + 100)
  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Strength"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: diagnostic


#-------------------------------------------
# Connection Status
#-------------------------------------------

# Binary sensor showing API connection state (connected/disconnected)
binary_sensor:
  - platform: status
    id: connection_state
    name: "Connection state"

#-------------------------------------------
# Network Information
#-------------------------------------------

# Text sensors providing WiFi connection details
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "Connected SSID"
      entity_category: diagnostic
    mac_address:
      name: "Mac Address"
      entity_category: diagnostic

#-------------------------------------------
# System Control Buttons
#-------------------------------------------

# Buttons to shutdown or restart the device
button:
  - platform: shutdown
    entity_category: diagnostic
    name: "Shutdown"
  - platform: restart
    entity_category: diagnostic
    name: "Restart"


