#-------------------------------------------
# ePaper Display Configuration
# Hardware settings for Waveshare 7.5" ePaper display
#-------------------------------------------

substitutions:

#-------------------------------------------
# Physical Display Dimensions
# Visible area within the physical frame
# NOTE: Width and height should be divisible by 8 for AI image generation
#-------------------------------------------
  display_min_pixel_x: '0'       # Left edge of visible area
  display_pixel_width: '480'     # Width of visible area
  display_min_pixel_y: '30'      # Top edge of visible area (30px offset from top)
  display_pixel_height: '744'    # Height of visible area
  display_rotation: '90°'        # Rotate display 90 degrees




#-------------------------------------------
# GPIO Pin Configuration
# ESP32 pin assignments for ePaper display communication
#-------------------------------------------

  gpio_spi_clk_pin: GPIO13       # SPI clock signal
  gpio_spi_mosi_pin: GPIO14      # SPI MOSI (data out)
  
  gpio_cs_pin: GPIO15            # Chip select
  gpio_dc_pin: GPIO27            # Data/Command control
  gpio_reset_pin: GPIO26         # Display reset
  gpio_busy_pin: GPIO25          # Display busy signal
  
  # IMPORTANT: The BUSY pin on gdew0154m09 and Waveshare 7.50in V2 must be inverted
  # to prevent permanent display damage
  gpio_busy_pin_inverted: 'true' 



