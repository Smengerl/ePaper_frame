#-------------------------------------------
# ESP32 Configuration
#-------------------------------------------
esp32:
  board: esp32dev
  framework:
    type: esp-idf


#-------------------------------------------
# PSRAM Configuration (Optional)
#-------------------------------------------
# PSRAM support for larger image buffers
# Only available on ESP32, not on Waveshare's display HAT
# Required for online image component with large images
# See: https://esphome.io/components/psram.html
#psram:
#  mode: octal
#  speed: 80MHz


#-------------------------------------------
# System Configuration
#-------------------------------------------

# Enable logging for debugging
logger:

# Home Assistant API (encryption key defined in main config)
#api:
#  encryption:
#    key: ${api_key}

# Enable Over-The-Air updates
ota:
  platform: esphome
  password: ${ota_pw}

# Allow WiFi provisioning via serial port
improv_serial:


#-------------------------------------------
# WiFi Configuration
#-------------------------------------------
wifi:
  id: wifi_id
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot in case WiFi connection fails
  # Creates an access point for manual WiFi configuration
  ap:
    ssid: ${fallback_hotspot_ssid} 
    password: ${fallback_hotspot_pw} 
    

#-------------------------------------------
# Network Provisioning
#-------------------------------------------

# Captive portal for WiFi credential configuration via AP mode
captive_portal:

# Dashboard import for easy device updates
dashboard_import:
  package_import_url: github://esphome/example-configs/esphome-web/esp32.yaml@main
  import_full_config: true

#-------------------------------------------
# Bluetooth Provisioning (Optional)
#-------------------------------------------
# Allows WiFi credential setup via Bluetooth Low Energy
#esp32_improv:
#  authorizer: none

# Web server for device management (Optional)
#web_server:
#  port: 80
#  version: 3


#-------------------------------------------
# SPI Bus Configuration
# Used for communication with ePaper display
#-------------------------------------------
spi:
  clk_pin: $gpio_spi_clk_pin
  mosi_pin: $gpio_spi_mosi_pin
  id: epaper_display

