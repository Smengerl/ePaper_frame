substitutions:
  name: "epaper-display"
  friendly_name: "ePaper Display"
  comment: "ePaper Display in picture frame"
  project_name: epaper_display.esphome

  TAG: "epaper-display.yaml"

  api_key: !secret epaper_api_key
  ota_pw: !secret epaper_ota_pw
  fallback_hotspot_ssid: "EPaper Fallback Hotspot"
  fallback_hotspot_pw: !secret epaper_fallback_pw

  # Path relative to http://<HA>:8123/ . The device learns the HA address on every
  # API connect from client_address (no mDNS/homeassistant.local, no fixed IP).
  # A full http(s):// URL in the image_url text is still used as-is.
  initial_image_path: "local/output.png"

  # Override the shared 8min default: the morning HA automation may take a while
  # generating a new image while the device waits online for its sleep_until, so
  # give it more head-room (fine for a mains-powered picture frame).
  deep_sleep_run_duration: "20min"

packages:
  device_basics: !include epaper_display_packages/device_basics.yaml
  debug_basics: !include shared_packages/debug_basics.yaml
  deep_sleep: !include shared_packages/deep_sleep.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: ${comment}
  min_version: "2026.8.1"
  name_add_mac_suffix: false
  compile_process_limit: 1
  project:
    name: ${project_name}
    version: "1.0"
  on_boot:
    priority: -100
    then:
      - light.turn_on: onboard_led # Turn on the LED during startup
      # Auto download + render happens in api.on_client_connected (only then is the
      # HA address known via client_address).

# Onboard LED control
output:
  - platform: gpio
    id: onboard_led_output
    pin:
      number: GPIO2 # Default onboard LED pin for most ESP32 boards
      ignore_strapping_warning: true

light:
  - platform: status_led
    name: "Onboard Status LED"
    icon: "mdi:led-on"
    id: "onboard_led"
    output: onboard_led_output
    entity_category: diagnostic
    internal: true

# event configuration
event:
  - platform: template
    name: Rendering
    id: rendering_events
    icon: "mdi:brush"
    event_types:
      - render_complete
    #on_event:
    #  then:
    #    - lambda: |-
    #        ESP_LOGD("${TAG}", "Render complete event %s triggered.", event_type.c_str());

  - platform: template
    name: Image Downloading
    id: image_downloading_events
    icon: "mdi:download"
    event_types:
      - image_downloading_complete
      - image_downloading_failed
    #on_event:
    #  then:
    #    - lambda: |-
    #        ESP_LOGD("${TAG}", "Image downloading complete event %s triggered.", event_type.c_str());

# Controls whether the display shall automatically download and render the image on startup
switch:
  - platform: template
    name: "Download and render on startup"
    id: auto_load_render
    icon: "mdi:cloud-download-outline"
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true

#time:
#  - platform: homeassistant
#    id: esptime

#-------------------------------------------
# AUTO REFRESH DISPLAY
# Automatically refresh display after specified number of hours
# Value 0 means no auto refresh
#-------------------------------------------
interval:
  - interval: 1h # Base interval for the check
    then:
      - lambda: |-
          if (id(auto_screen_refresh).state > 0) {
            id(auto_refresh_counter)++;

            if (id(auto_refresh_counter) >= id(auto_screen_refresh).state) {
              id(auto_refresh_counter) = 0;  // Reset counter
              ESP_LOGI("${TAG}", "Timer triggered re-rendering");
              id(eink_display).update();
            }
          }

number:
  - platform: template
    name: "Auto Screen refresh"
    id: auto_screen_refresh
    unit_of_measurement: "h"
    icon: "mdi:refresh-auto"
    optimistic: true
    restore_value: true # Remember the auto-refresh interval across reboots (otherwise back to 0 = off)
    min_value: 0
    max_value: 96
    step: 1
    initial_value: 0
    on_value:
      then:
        - lambda: |-
            id(auto_refresh_counter) = 0;  // Reset counter
            if (x == 0) {
              ESP_LOGI("${TAG}", "Disable auto screen refresh");
            } else {
              ESP_LOGI("${TAG}", "Auto screen refresh updated: %.0fh", x);
            }

globals:
  - id: auto_refresh_counter
    type: int
    restore_value: no
    initial_value: "0"

  # HA address (IP), learned from api.on_client_connected -> client_address.
  # Empty until the first connect. restore_value: learned IP as a fallback across reboots.
  - id: ha_host
    type: std::string
    restore_value: yes
    max_restore_data_length: 50
    initial_value: '""'

  # Auto-render only once per boot (not on every API reconnect)
  - id: did_initial_render
    type: bool
    restore_value: no
    initial_value: "false"

  # Bounded auto-retry counter for failed image downloads (e.g. network not fully
  # ready right after wake). Reset on every successful download.
  - id: img_dl_retries
    type: int
    restore_value: no
    initial_value: "0"

button:
  - platform: template
    name: "Reload image"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(online_image_id).update();

  - platform: template
    name: "Render"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(eink_display).update();

text:
  - platform: template
    id: image_url
    name: "Image URL"
    icon: "mdi:image"
    mode: text
    optimistic: true
    restore_value: yes
    # Holds either a path (e.g. "local/output.png" -> http://<HA>:8123/<path>)
    # OR a full http(s):// URL (used unchanged in that case).
    initial_value: $initial_image_path
    on_value:
      then:
        - script.execute: apply_image_url

script:
  # Builds the image URL from image_url + the learned HA address (ha_host) and hands
  # it to online_image. Called on image_url change and on api.on_client_connected
  # (then with a fresh IP).
  - id: apply_image_url
    then:
      - lambda: |-
          std::string v = id(image_url).state;
          std::string url;
          if (v.rfind("http://", 0) == 0 || v.rfind("https://", 0) == 0) {
            url = v;                                  // full URL - unchanged
          } else {
            if (id(ha_host).empty()) {
              ESP_LOGD("${TAG}", "HA address not known yet - image URL not set");
              return;
            }
            if (!v.empty() && v[0] == '/') v.erase(0, 1);
            url = "http://" + id(ha_host) + ":8123/" + v;
          }
          ESP_LOGI("${TAG}", "Image URL: %s", url.c_str());
          id(online_image_id).set_url(url);

#-------------------------------------------
# API
# Enable Home Assistant API
# Expose all relevant functions for scripting in HA e.g. in automations
#-------------------------------------------
api:
  on_client_connected:
    - lambda: |-
        ESP_LOGI("${TAG}", "HA connected from %s", client_address.c_str());
        id(ha_host) = client_address.c_str();
    - script.execute: apply_image_url   # rebuild the image URL with the fresh IP
    - if:
        condition:
          lambda: "return id(auto_load_render).state && !id(did_initial_render);"
        then:
          - lambda: "id(did_initial_render) = true;"
          - lambda: |-
              ESP_LOGI("${TAG}", "Auto download + render on startup");
              id(online_image_id).update();

  encryption:
    key: ${api_key}

  actions:
    - action: epaper_reload_image
      then:
        - lambda: "id(online_image_id).update();"

    - action: epaper_render
      then:
        - lambda: "id(eink_display).update();"

    # Set a full URL - http(s)://... is used unchanged
    - action: epaper_set_image_url
      variables:
        url: string
      then:
        - lambda: |-
            auto call = id(image_url).make_call();
            call.set_value(url);
            call.perform();

    # Filename under /local/ (backwards compatible: "output.png" -> local/output.png)
    - action: epaper_set_local_image_url
      variables:
        local_url: string
      then:
        - lambda: |-
            auto call = id(image_url).make_call();
            call.set_value(std::string("local/") + local_url);
            call.perform();

# NOTE: migrated image: and online_image: to the new image: platform format
# (platform: file / platform: online_image)
image:
  - platform: file
    file: "images/offline.png"
    id: offline_image_id
    type: BINARY

  - platform: online_image
    # Placeholder - overwritten via set_url() by apply_image_url (image_url on_value /
    # on_client_connected) before every real fetch.
    url: "http://127.0.0.1/"
    id: online_image_id
    format: PNG
    update_interval: never   # only fetch on .update()

    buffer_size: 32768
    resize: ${display_pixel_width}x${display_pixel_height}
    type: BINARY
    placeholder: offline_image_id # optional
    on_download_finished:
      - then:
          - lambda: |-
              id(img_dl_retries) = 0;   // success - clear retry budget
              ESP_LOGI("online_image", "Image download finished");
              id(image_downloading_events).trigger("image_downloading_complete");
          - component.update: eink_display
    on_error:
      - if:
          condition:
            lambda: "return id(img_dl_retries) < 3;"
          then:
            # Transient failure (DNS/routing not ready just after wake, HA busy
            # writing the image, ...) - back off briefly and try again.
            - lambda: |-
                id(img_dl_retries) += 1;
                ESP_LOGW("online_image", "Download failed - retry %d/3 in 15s", id(img_dl_retries));
            - delay: 15s
            - lambda: "id(online_image_id).update();"
          else:
            - lambda: |-
                id(img_dl_retries) = 0;
                ESP_LOGE("online_image", "Could not download the image (gave up after 3 retries)");
                id(image_downloading_events).trigger("image_downloading_failed");

# Set up the HTTP request component
# HTTP request component to get picture URLs
http_request:
  # false: images come over http:// from HA. verify_ssl: true would link the whole
  # CA bundle (~64 KB flash) into the esp-idf build for nothing. https sources are
  # still loaded, just without cert verification.
  verify_ssl: false
  useragent: esphome/1.0
  timeout: 120s

# Now render everything on the ePaper screen.
# See: https://esphome.io/components/display/waveshare_epaper.html
display:
  - platform: waveshare_epaper
    id: eink_display
    cs_pin:
      number: $gpio_cs_pin
      ignore_strapping_warning: true
    reset_pin: $gpio_reset_pin
    dc_pin: $gpio_dc_pin
    busy_pin:
      number: $gpio_busy_pin
      inverted: $gpio_busy_pin_inverted
    reset_duration: $reset_duration
    model: $display_model
    # full_update_every: $full_update_every
    update_interval: never # manual refresh only via component.update / Example for alternative: 60s
    rotation: $display_rotation
    lambda: |-
      static const char *TAG = "${TAG} - Rendering cycle";

      ESP_LOGI(TAG, "Rendering...");
      id(deep_sleep_id).prevent_deep_sleep();

      if(id(wifi_id).is_connected()) {
        it.fill(COLOR_OFF);
        // Fullscreen online image
        it.image(${display_min_pixel_x}, ${display_min_pixel_y}, id(online_image_id), COLOR_OFF, COLOR_ON);
      } else {
        ESP_LOGW(TAG, "Wifi not connected. Using offline image");
        // Black background, offline image centered horizontally and vertically
        it.fill(COLOR_ON);
        int mid_x = $display_min_pixel_x + $display_pixel_width / 2;
        int mid_y = $display_min_pixel_y + $display_pixel_height / 2;
        it.image(mid_x - id(offline_image_id).get_width()/2, mid_y - id(offline_image_id).get_height()/2, id(offline_image_id), COLOR_OFF, COLOR_ON);
      }

      ESP_LOGI(TAG, "Rendering done");
      id(deep_sleep_id).allow_deep_sleep();
      id(rendering_events).trigger("render_complete");
